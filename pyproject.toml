[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ribeira-conecta-platform"
version = "0.1.0"
description = "Auditável, multi-tenant foundation for Ribeira Conecta Intelligence Platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
gis = ["psycopg[binary]>=3.2", "shapely>=2.0"]

[project.scripts]
ribeira-api = "ribeira_platform.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
