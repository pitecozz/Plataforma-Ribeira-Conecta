[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ribeira-conecta-platform"
version = "0.1.0"
description = "Auditável, multi-tenant foundation for Ribeira Conecta Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.5",
  "psycopg[binary]==3.2.3",
  "PyJWT[crypto]==2.14.0",
  "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "httpx==0.28.1",
  "ruff==0.9.6",
  "mypy==1.14.1",
  "pip-audit==2.7.3",
  "bandit==1.8.3",
  "detect-secrets==1.5.0",
]
gis = ["shapely==2.0.7"]

[project.scripts]
ribeira-api = "ribeira_platform.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
