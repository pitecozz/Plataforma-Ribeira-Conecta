name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q src tests
      - name: Unit and integrity tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  supply-chain-placeholder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Document security gate status
        run: |
          test -f docs/security/THREAT_MODEL.md
          echo "SAST/SCA/SBOM/DAST/IaC gates are deployment prerequisites documented in the threat model."
